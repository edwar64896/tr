name: Build and push to ECR

# Builds the Docker image and pushes it to Amazon ECR.
# Auth is via OIDC — GitHub assumes an IAM role at runtime, so there are no
# long-lived AWS keys stored in the repo. One-time AWS setup is in
# deploy/aws-oidc-setup.sh; the resulting role ARN goes in the repo secret
# AWS_ROLE_ARN.

on:
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main
      - claude/xml-artifact-search-prototype-ds6ntr
    paths:
      - "Dockerfile"
      - "web/**"
      - "tools/**"
      - "data/**"
      - "deploy/nginx.conf"
      - ".github/workflows/build-push-ecr.yml"

# Edit these two to match your account.
env:
  AWS_REGION: eu-west-2
  ECR_REPO: tr-archive

permissions:
  id-token: write     # required to request the OIDC token
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64          # your EC2 box is Intel/x86_64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed to ECR:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # Pulls the freshly-pushed image onto the EC2 box and restarts the container,
  # driven remotely via SSM (no inbound SSH). Skipped until the repo variable
  # EC2_INSTANCE_ID is set. Requires the instance to have an IAM role with
  # SSM + ECR-read access (see deploy/ec2-instance-role.sh).
  deploy:
    needs: build-push
    if: ${{ vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="$REGISTRY/${ECR_REPO}:latest"

          # The script SSM runs on the box (as root): log in, pull, replace.
          read -r -d '' SCRIPT <<EOF || true
          set -e
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}
          docker pull ${IMAGE}
          docker rm -f tr-archive 2>/dev/null || true
          docker run -d --name tr-archive --restart unless-stopped -p 80:80 ${IMAGE}
          docker image prune -f
          EOF

          # Build the SendCommand parameters safely (one array entry per line).
          jq -n --arg s "$SCRIPT" '{commands: ($s | split("\n"))}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy tr-archive ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          # Poll for completion (up to ~2.5 min).
          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
            esac
            if [ "$i" = "30" ]; then echo "::error::timed out waiting for SSM"; exit 1; fi
          done

          echo "----- deploy output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "Deployed ${IMAGE} to $INSTANCE_ID" >> $GITHUB_STEP_SUMMARY
