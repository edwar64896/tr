name: Build and push to ECR

# Builds the Docker image and pushes it to Amazon ECR.
# Auth is via OIDC — GitHub assumes an IAM role at runtime, so there are no
# long-lived AWS keys stored in the repo. One-time AWS setup is in
# deploy/aws-oidc-setup.sh; the resulting role ARN goes in the repo secret
# AWS_ROLE_ARN.

on:
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main
      - claude/xml-artifact-search-prototype-ds6ntr
    paths:
      - "Dockerfile"
      - "web/**"
      - "tools/**"
      - "data/**"
      - "deploy/nginx.conf"
      - ".github/workflows/build-push-ecr.yml"

# Edit these two to match your account.
env:
  AWS_REGION: eu-west-2
  ECR_REPO: tr-archive

permissions:
  id-token: write     # required to request the OIDC token
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64          # your EC2 box is Intel/x86_64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "On the EC2 box, deploy the latest with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker rm -f tr-archive 2>/dev/null || true" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name tr-archive --restart unless-stopped -p 80:80 ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
