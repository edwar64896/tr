<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talyllyn Railway Archive — Catalogue</title>
<style>
/* ---------- Theme tokens: light is the bare :root ---------- */
:root{
  --paper:#e9ebe4;         /* cool archival off-white, slight green bias */
  --surface:#f3f4ef;
  --surface-2:#dfe2d8;
  --ink:#182420;           /* near-black, green bias */
  --ink-soft:#42504a;
  --muted:#5c6b6e;         /* slate */
  --line:#c9cdbf;
  --line-soft:#d7dacf;
  --green:#215c3f;         /* Talyllyn loco green */
  --green-bright:#2c7a53;
  --brass:#b07d33;         /* brass / ochre highlight */
  --brass-soft:#f0e4cd;
  --danger:#9c3b2e;
  --chip:#dfe6dd;
  --shadow:0 1px 2px rgba(24,36,32,.06),0 6px 24px rgba(24,36,32,.08);
  --shadow-lg:0 12px 48px rgba(24,36,32,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131917; --surface:#1a221f; --surface-2:#222b28;
    --ink:#e8ede8; --ink-soft:#bcc7c1; --muted:#8fa19a;
    --line:#2c3833; --line-soft:#26302c;
    --green:#4fae7d; --green-bright:#63c493;
    --brass:#d9a95a; --brass-soft:#33301f;
    --chip:#243029;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
    --shadow-lg:0 16px 56px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#131917; --surface:#1a221f; --surface-2:#222b28;
  --ink:#e8ede8; --ink-soft:#bcc7c1; --muted:#8fa19a;
  --line:#2c3833; --line-soft:#26302c;
  --green:#4fae7d; --green-bright:#63c493;
  --brass:#d9a95a; --brass-soft:#33301f;
  --chip:#243029;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 56px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",Consolas,monospace}
a{color:var(--green)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}

/* ---------- Masthead ---------- */
header.masthead{
  border-bottom:2px solid var(--ink);
  background:var(--surface);
  padding:14px clamp(14px,3vw,32px);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.crest{
  width:44px;height:44px;flex:0 0 auto;border-radius:50%;
  background:var(--green);color:#fff;display:grid;place-items:center;
  font-family:Georgia,serif;font-weight:700;font-size:19px;
  box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px var(--green);
}
:root[data-theme="dark"] .crest,
@media (prefers-color-scheme:dark){}
.brand h1{font-size:clamp(17px,2.4vw,22px);line-height:1.1}
.brand .sub{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.stat{text-align:right}
.stat b{font-family:Georgia,serif;font-size:20px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.toggle{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;
  display:inline-flex;align-items:center;text-decoration:none;
}
.toggle:hover{border-color:var(--green)}

/* ---------- Layout ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;align-items:start}
aside.filters{
  position:sticky;top:74px;align-self:start;
  height:calc(100vh - 74px);overflow-y:auto;
  border-right:1px solid var(--line);
  padding:18px clamp(12px,1.4vw,18px) 40px;
  background:var(--surface);
}
main{padding:18px clamp(14px,3vw,32px) 80px;min-width:0}

/* ---------- Search ---------- */
.searchbox{position:relative;margin-bottom:8px}
.searchbox input{
  width:100%;padding:11px 34px 11px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);color:var(--ink);font-size:14px;
}
.searchbox input:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
.searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;display:none}
.searchbox .clr.show{display:block}

.facet{margin-top:20px}
.facet > h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-family:inherit;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.facet .reset{font-size:11px;color:var(--green);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;border:0;background:none;padding:0}
.optlist{display:flex;flex-direction:column;gap:1px;max-height:230px;overflow-y:auto;margin:-2px}
.opt{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px;user-select:none}
.opt:hover{background:var(--surface-2)}
.opt input{accent-color:var(--green);margin:0;flex:0 0 auto}
.opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.opt.off{opacity:.4}
.decades{display:flex;flex-wrap:wrap;gap:6px}
.decade{border:1px solid var(--line);background:var(--paper);border-radius:999px;
  padding:4px 10px;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.decade.active{background:var(--green);color:#fff;border-color:var(--green)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:5px 6px}
.switch input{accent-color:var(--green)}

/* ---------- Results ---------- */
.results-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.results-head .count{font-family:Georgia,serif;font-size:19px}
.results-head .count b{color:var(--green)}
.results-head .chips{display:flex;gap:6px;flex-wrap:wrap}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line-soft);
  border-radius:999px;padding:3px 6px 3px 10px;font-size:12px}
.tagchip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0}
.sortsel{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.sortsel select{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:7px;padding:6px 8px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  padding:14px 15px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:9px;transition:border-color .12s,transform .12s,box-shadow .12s;
}
.card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green);opacity:0;transition:opacity .12s}
.card:hover::before{opacity:1}
.card .ref{font-size:12px;color:var(--brass);font-weight:600}
.card .ttl{font-family:Georgia,serif;font-size:15.5px;line-height:1.3;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px}
.pill{border-radius:999px;padding:2px 8px;background:var(--chip);color:var(--ink-soft);border:1px solid var(--line-soft)}
.pill.cls{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.pill.yr{font-variant-numeric:tabular-nums}
.pill.img{background:var(--green);color:#fff;border-color:transparent;display:inline-flex;align-items:center;gap:4px}
.sentinel{height:1px}
.more{grid-column:1/-1;text-align:center;color:var(--muted);padding:14px;font-size:13px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h2{font-size:20px;color:var(--ink);margin-bottom:8px}

/* ---------- Detail drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.5);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dhead .ref{font-size:13px;color:var(--brass);font-weight:600}
.drawer .dhead h2{font-size:20px;line-height:1.25;margin-top:4px;text-wrap:balance}
.drawer .x{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px;flex:0 0 auto}
.drawer .x:hover{border-color:var(--green)}
.dbody{padding:6px 22px 40px;overflow-y:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:16px 0}
.thumb{aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);display:flex;flex-direction:column}
.thumb a{flex:1;min-height:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);padding:8px;text-align:center}
.thumb .ph svg{opacity:.5}
.thumb .cap{font-size:10px;padding:5px 6px;border-top:1px solid var(--line);color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fields{border-collapse:collapse;width:100%;margin-top:8px}
.fields th{text-align:left;vertical-align:top;color:var(--muted);font-weight:600;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:9px 14px 9px 0;white-space:nowrap;width:120px}
.fields td{padding:9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.fields tr:last-child td{border-bottom:0}
.note{background:var(--brass-soft);border-radius:8px;padding:12px 14px;font-size:13.5px;margin-top:14px;color:var(--ink-soft)}
.media{margin-top:16px}
.mediahd{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:inherit;font-weight:700;margin-bottom:8px}
.mediafile{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;text-decoration:none;color:var(--ink);font-size:13px}
.mediafile:hover{border-color:var(--green)}
.mediafile .ext{background:var(--green);color:#fff;border-radius:5px;padding:2px 7px;font-size:11px;flex:0 0 auto}
.imgbanner{font-size:12px;color:var(--muted);margin:2px 0 0;display:flex;align-items:center;gap:7px}
.imgbanner code{background:var(--surface-2);padding:1px 5px;border-radius:4px}

footer{border-top:1px solid var(--line);padding:20px clamp(14px,3vw,32px);color:var(--muted);font-size:12px}

@media(max-width:820px){
  .wrap{grid-template-columns:1fr}
  aside.filters{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .stats{width:100%;justify-content:flex-start;margin-left:0}
}
</style>
</head>
<body>
<header class="masthead">
  <div class="brand">
    <div class="crest">TR</div>
    <div>
      <h1>Talyllyn Railway Archive</h1>
      <div class="sub">Fonds Z/DDJ · Dolgellau Deposit · Catalogue &amp; Image Search</div>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <a class="toggle" href="./admin.html" title="Add new artifacts / update the catalogue">✎ Update</a>
  <button class="toggle" id="themeBtn" title="Toggle theme">◐ Theme</button>
</header>

<div class="wrap">
  <aside class="filters">
    <div class="searchbox">
      <input id="q" type="search" placeholder="Search titles, references, notes…" autocomplete="off" spellcheck="false">
      <button class="clr" id="clrq" title="Clear">×</button>
    </div>
    <label class="switch"><input type="checkbox" id="imgOnly"> Only items with scanned images</label>

    <div class="facet">
      <h3>Decade <button class="reset" data-reset="decade" hidden>clear</button></h3>
      <div class="decades" id="decades"></div>
    </div>

    <div class="facet">
      <h3>Classification <button class="reset" data-reset="classification" hidden>clear</button></h3>
      <div class="optlist" id="fClass"></div>
    </div>

    <div class="facet">
      <h3>Location <button class="reset" data-reset="location" hidden>clear</button></h3>
      <div class="optlist" id="fLoc"></div>
    </div>
  </aside>

  <main>
    <div class="results-head">
      <div class="count" id="count"></div>
      <div class="chips" id="activeChips"></div>
      <div class="sortsel">
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="ref">Reference no.</option>
          <option value="title">Title A–Z</option>
          <option value="yearAsc">Year (oldest)</option>
          <option value="yearDesc">Year (newest)</option>
          <option value="img">Illustrated first</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<footer>
  Prototype catalogue viewer · data from the MODES XML export ·
  scans &amp; media served from S3 · add new artifacts via
  <a href="./admin.html">Update the catalogue</a> · proof of concept.
</footer>

<script>
/* ============================================================
   CONFIG
   IMAGE_BASE  — where the scanned images / media live. Points at the S3
                 bucket holding the files. Filenames are URL-encoded when the
                 link is built, so keys with spaces/parentheses work. Set to ""
                 to show reference placeholders instead of loading images.
                 (For a private bucket, front it with CloudFront and use that
                 domain here.)
   CATALOGUE_URL — where to load the catalogue data from. Leave "" to use the
                 catalogue.json served next to this page (or the inline demo
                 build). Set to a URL — e.g. the same S3 bucket — so the data
                 can be refreshed without rebuilding the site (that bucket then
                 needs a CORS rule allowing GET; see README / admin page).
   ============================================================ */
var IMAGE_BASE = "https://trarchive-766743414531-eu-north-1-an.s3.eu-north-1.amazonaws.com/";
var CATALOGUE_URL = "https://trarchive-766743414531-eu-north-1-an.s3.eu-north-1.amazonaws.com/catalogue.json";

/* Build a URL for an image / media file from its bare filename. */
function assetURL(fn){ return IMAGE_BASE + encodeURIComponent(fn); }

/* ---- Data loader: inline <script id="catalogue-data"> if present, else
        CATALOGUE_URL if set, else ./catalogue.json (the hosted layout). ---- */
(function(){
  var inline = document.getElementById("catalogue-data");
  if (inline) { boot(JSON.parse(inline.textContent)); return; }
  var src = CATALOGUE_URL || "./catalogue.json";
  fetch(src, {cache:"no-cache"}).then(function(r){return r.json();}).then(boot)
    .catch(function(e){
      document.getElementById("grid").innerHTML =
        '<div class="empty"><h2>Could not load the catalogue</h2>'+
        '<p>Tried <code>'+esc(src)+'</code>. Serve this folder over HTTP '+
        '(or open the bundled demo build).</p></div>';
    });
})();

function boot(DATA){
  var RECORDS = DATA.records;

  // Precompute a lowercased search blob per record.
  RECORDS.forEach(function(r){
    r._s = [r.id,r.title,r.classification,r.objectName,r.maker,r.location,
            r.notes,r.content,r.description,r.dateBegin]
            .filter(Boolean).join(" ").toLowerCase();
    r._dec = r.year ? Math.floor(r.year/10)*10 : null;
  });

  // ---- Stats ----
  var stats = [
    [DATA.summary.count.toLocaleString(),"Catalogue records"],
    [uniq(RECORDS,"classification").length,"Classifications"],
    [DATA.summary.withImages,"Illustrated"],
    [DATA.summary.totalImages,"Scanned images"]
  ];
  document.getElementById("stats").innerHTML = stats.map(function(s){
    return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>';
  }).join("");

  // ---- State ----
  var state = { q:"", classification:new Set(), location:new Set(),
                decade:null, imgOnly:false, sort:"ref" };
  var PAGE = 48, shown = PAGE, filtered = [];

  // ---- Helpers ----
  function uniqCounts(records, field){
    var m = new Map();
    records.forEach(function(r){ var v=r[field]; if(v) m.set(v,(m.get(v)||0)+1); });
    return [...m.entries()].sort(function(a,b){return b[1]-a[1];});
  }
  function matchExcept(except){
    // filtered set applying every active filter EXCEPT `except` dimension.
    var terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    return RECORDS.filter(function(r){
      if(terms.length && !terms.every(function(t){return r._s.indexOf(t)>=0;})) return false;
      if(state.imgOnly && !r.images.length) return false;
      if(except!=="decade" && state.decade!==null && r._dec!==state.decade) return false;
      if(except!=="classification" && state.classification.size && !state.classification.has(r.classification)) return false;
      if(except!=="location" && state.location.size && !state.location.has(r.location)) return false;
      return true;
    });
  }
  function refCmp(a,b){
    var A=a.id.split(/[\/\-]/), B=b.id.split(/[\/\-]/);
    for(var i=0;i<Math.max(A.length,B.length);i++){
      var x=A[i]||"", y=B[i]||"", nx=parseInt(x,10), ny=parseInt(y,10);
      if(!isNaN(nx)&&!isNaN(ny)){ if(nx!==ny) return nx-ny; }
      else if(x!==y){ return x<y?-1:1; }
    }
    return 0;
  }

  // ---- Facet rendering (counts reflect other active filters) ----
  function renderFacets(){
    var clsBase = matchExcept("classification");
    var locBase = matchExcept("location");
    var decBase = matchExcept("decade");

    // classification (top 25)
    var cls = uniqCounts(clsBase,"classification").slice(0,25);
    // ensure selected-but-zero still show
    state.classification.forEach(function(v){ if(!cls.some(function(c){return c[0]===v;})) cls.push([v,0]); });
    document.getElementById("fClass").innerHTML = cls.map(function(c){
      var on = state.classification.has(c[0]);
      return opt("classification",c[0],c[1],on);
    }).join("");

    var loc = uniqCounts(locBase,"location");
    state.location.forEach(function(v){ if(!loc.some(function(c){return c[0]===v;})) loc.push([v,0]); });
    document.getElementById("fLoc").innerHTML = loc.map(function(c){
      return opt("location",c[0],c[1],state.location.has(c[0]));
    }).join("");

    // decades
    var decMap = new Map();
    decBase.forEach(function(r){ if(r._dec!=null) decMap.set(r._dec,(decMap.get(r._dec)||0)+1); });
    var decs = [...decMap.keys()].sort(function(a,b){return a-b;});
    document.getElementById("decades").innerHTML = decs.map(function(d){
      var on = state.decade===d;
      return '<button class="decade'+(on?' active':'')+'" data-dec="'+d+'">'+d+'s</button>';
    }).join("") || '<span style="color:var(--muted);font-size:12px">—</span>';

    // reset buttons visibility
    document.querySelectorAll("[data-reset]").forEach(function(b){
      var k=b.getAttribute("data-reset");
      var active = k==="decade" ? state.decade!==null : state[k].size>0;
      b.hidden = !active;
    });
  }
  function opt(dim,val,n,on){
    return '<label class="opt'+(n===0&&!on?' off':'')+'"><input type="checkbox" data-dim="'+dim+
      '" value="'+esc(val)+'"'+(on?' checked':'')+'>'+
      '<span class="lbl" title="'+esc(val)+'">'+esc(val)+'</span><span class="n">'+n+'</span></label>';
  }

  // ---- Results ----
  function apply(){
    filtered = matchExcept(null);
    filtered.sort(sorter(state.sort));
    shown = PAGE;
    renderResults();
    renderFacets();
    renderChips();
  }
  function sorter(mode){
    if(mode==="title") return function(a,b){return (a.title||"").localeCompare(b.title||"");};
    if(mode==="yearAsc") return function(a,b){return (a.year||9999)-(b.year||9999)||refCmp(a,b);};
    if(mode==="yearDesc") return function(a,b){return (b.year||-1)-(a.year||-1)||refCmp(a,b);};
    if(mode==="img") return function(a,b){return (b.images.length>0)-(a.images.length>0)||refCmp(a,b);};
    return refCmp;
  }
  function renderResults(){
    var g = document.getElementById("grid");
    document.getElementById("count").innerHTML =
      "<b>"+filtered.length.toLocaleString()+"</b> "+(filtered.length===1?"record":"records");
    if(!filtered.length){
      g.innerHTML = '<div class="empty"><h2>No matching records</h2><p>Try removing a filter or broadening your search.</p></div>';
      return;
    }
    var slice = filtered.slice(0,shown);
    g.innerHTML = slice.map(cardHTML).join("") +
      (shown<filtered.length ? '<div class="more">Showing '+shown+' of '+filtered.length.toLocaleString()+' — scroll for more</div>' : '');
  }
  function cardHTML(r){
    var meta = [];
    if(r.classification) meta.push('<span class="pill cls">'+esc(r.classification)+'</span>');
    if(r.year) meta.push('<span class="pill yr">'+r.year+'</span>');
    if(r.images.length) meta.push('<span class="pill img">▤ '+r.images.length+'</span>');
    return '<article class="card" data-id="'+esc(r.id)+'">'+
      '<div class="ref mono">'+esc(r.id)+'</div>'+
      '<div class="ttl">'+esc(r.title)+'</div>'+
      '<div class="meta">'+meta.join("")+'</div></article>';
  }
  function renderChips(){
    var chips=[];
    if(state.q) chips.push(chip("search: “"+state.q+"”","q"));
    if(state.decade!==null) chips.push(chip(state.decade+"s","decade"));
    state.classification.forEach(function(v){chips.push(chip(v,"classification",v));});
    state.location.forEach(function(v){chips.push(chip(v,"location",v));});
    if(state.imgOnly) chips.push(chip("illustrated only","imgOnly"));
    document.getElementById("activeChips").innerHTML = chips.join("");
  }
  function chip(label,kind,val){
    return '<span class="tagchip">'+esc(label)+'<button data-chip="'+kind+'" data-val="'+esc(val||"")+'">×</button></span>';
  }

  // ---- Drawer ----
  function openDrawer(id){
    var r = RECORDS.find(function(x){return x.id===id;});
    if(!r) return;
    var d = document.getElementById("drawer");
    var rows = [
      ["Object name", r.objectName],
      ["Classification", r.classification],
      ["Date", [r.dateBegin,r.dateEnd].filter(Boolean).join(" – ") || (r.year||"")],
      ["Maker / origin", r.maker],
      ["Current location", r.location],
      ["Record type", r.recordType],
      ["People / content", r.content],
      ["Description", r.description]
    ].filter(function(x){return x[1];});

    var gallery = "";
    if(r.images.length){
      gallery = '<p class="imgbanner">▤ '+r.images.length+' scanned image'+(r.images.length>1?'s':'')+
        (IMAGE_BASE ? '' : ' · set <code class="mono">IMAGE_BASE</code> to load them')+'</p>'+
        '<div class="gallery">'+ r.images.map(function(fn){
          var cell = IMAGE_BASE
            ? '<a href="'+esc(assetURL(fn))+'" target="_blank" rel="noopener">'+
                '<img loading="lazy" src="'+esc(assetURL(fn))+'" alt="'+esc(fn)+'"></a>'
            : '<div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5L5 19"/></svg><span style="font-size:10px">scan</span></div>';
          return '<div class="thumb">'+cell+'<div class="cap mono" title="'+esc(fn)+'">'+esc(fn)+'</div></div>';
        }).join("") + '</div>';
    }
    var media = "";
    if(r.media && r.media.length){
      media = '<div class="media"><h3 class="mediahd">Attached files</h3>'+
        r.media.map(function(fn){
          return '<a class="mediafile" href="'+esc(assetURL(fn))+'" target="_blank" rel="noopener">'+
            '<span class="ext mono">'+esc((fn.split(".").pop()||"file").toUpperCase())+'</span>'+
            '<span class="mono" style="min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(fn)+'</span></a>';
        }).join("") + '</div>';
    }
    var note = r.notes ? '<div class="note"><b>Curator’s note:</b> '+esc(r.notes)+'</div>' : "";

    d.innerHTML =
      '<div class="dhead"><div><div class="ref mono">'+esc(r.id)+'</div>'+
        '<h2>'+esc(r.title)+'</h2></div>'+
        '<button class="x" id="dclose" title="Close">×</button></div>'+
      '<div class="dbody">'+ gallery +
        '<table class="fields"><tbody>'+ rows.map(function(x){
          return '<tr><th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td></tr>';
        }).join("") +'</tbody></table>'+ media + note +'</div>';

    d.classList.add("open"); d.setAttribute("aria-hidden","false");
    document.getElementById("scrim").classList.add("open");
    document.getElementById("dclose").onclick = closeDrawer;
  }
  function closeDrawer(){
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("drawer").setAttribute("aria-hidden","true");
    document.getElementById("scrim").classList.remove("open");
  }

  // ---- Events ----
  var qEl = document.getElementById("q"), tmr;
  qEl.addEventListener("input", function(){
    document.getElementById("clrq").classList.toggle("show", !!qEl.value);
    clearTimeout(tmr); tmr=setTimeout(function(){ state.q=qEl.value.trim(); apply(); },140);
  });
  document.getElementById("clrq").onclick=function(){ qEl.value=""; state.q=""; qEl.focus();
    document.getElementById("clrq").classList.remove("show"); apply(); };
  document.getElementById("imgOnly").onchange=function(e){ state.imgOnly=e.target.checked; apply(); };
  document.getElementById("sort").onchange=function(e){ state.sort=e.target.value; apply(); };

  document.querySelector("aside.filters").addEventListener("change", function(e){
    var cb=e.target.closest("input[data-dim]"); if(!cb) return;
    var dim=cb.getAttribute("data-dim"), val=cb.value;
    if(cb.checked) state[dim].add(val); else state[dim].delete(val);
    apply();
  });
  document.getElementById("decades").addEventListener("click", function(e){
    var b=e.target.closest("[data-dec]"); if(!b) return;
    var d=parseInt(b.getAttribute("data-dec"),10);
    state.decade = state.decade===d ? null : d; apply();
  });
  document.querySelectorAll("[data-reset]").forEach(function(b){
    b.addEventListener("click",function(){
      var k=b.getAttribute("data-reset");
      if(k==="decade") state.decade=null; else state[k].clear(); apply();
    });
  });
  document.getElementById("activeChips").addEventListener("click", function(e){
    var b=e.target.closest("[data-chip]"); if(!b) return;
    var kind=b.getAttribute("data-chip"), val=b.getAttribute("data-val");
    if(kind==="q"){ state.q=""; qEl.value=""; document.getElementById("clrq").classList.remove("show"); }
    else if(kind==="decade") state.decade=null;
    else if(kind==="imgOnly"){ state.imgOnly=false; document.getElementById("imgOnly").checked=false; }
    else state[kind].delete(val);
    apply();
  });
  document.getElementById("grid").addEventListener("click", function(e){
    var c=e.target.closest(".card"); if(c) openDrawer(c.getAttribute("data-id"));
  });
  document.getElementById("scrim").onclick=closeDrawer;
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape") closeDrawer();
    if(e.key==="/" && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); }
  });

  // infinite scroll
  new IntersectionObserver(function(ents){
    if(ents[0].isIntersecting && shown<filtered.length){ shown+=PAGE; renderResults(); }
  },{rootMargin:"600px"}).observe(document.getElementById("sentinel"));

  // theme toggle
  var tb=document.getElementById("themeBtn");
  tb.onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next = cur==="dark" ? "light" : cur==="light" ? "dark"
      : (matchMedia("(prefers-color-scheme:dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
  };

  apply();
}

/* utils */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function uniq(a,f){var s=new Set();a.forEach(function(r){if(r[f])s.add(r[f]);});return [...s];}
</script>
</body>
</html>
