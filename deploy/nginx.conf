server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA-ish: everything falls back to the single page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for the (large) catalogue payload and scans; the HTML stays fresh.
    location = /catalogue.json {
        add_header Cache-Control "public, max-age=3600";
    }
    location /scans/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/html;
    gzip_min_length 1024;
}
